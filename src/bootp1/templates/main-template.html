<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html, lang="en">

	<style>
		#sections {
			top: 0;
			left: 0;
			list-style-type: none;
			margin: 0;
			padding: 0;
			width: 200px;
			background-color: #f1f1f1;
			height: 100%;
			position: fixed;
			overflow: auto;
		}

		#section_buffer {
			padding-top: 24px;
			padding-left: 12px;
		}

		.section:link .section:visited {
			border: 2px solid green;
			text-align: left;
			text-decoration: none;
		}

		.section:hover .section:active {
			background-color: green;
			color: white;
		}

		#tabs {
			display: flex;
			justify-content: center;
			align-items: center;
			list-style-type: none;
			margin: 0;
			padding: 0;
			background-color: #f1f1f1;
		}

		.tab {
			display: block;
			padding-left: 14px;
			padding-right: 16px;
			text-decoration: none;
		}
	</style>

	<head>
		{% block head %}
		<title>{% block title %}{% endblock %}</title>
		{% endblock %}
	</head>

	<body>
		<menu id="sections">
			<div id="section_buffer">
				<li group="section"><a href="/home">Home</a></li>
				<li group="section"><a href="/sections/invoices">Invoices</a></li>
				<li group="section">Estimates</li>
				<li group="section">Vehicles</li>
				<li group="section">Insurance</li>
			</div>
		</menu>


		<menu id="tabs">
			{% block tabs %}
			{% endblock %}
		</menu>
		{% block page %}
		{% endblock %}
	</body>

	</html>
