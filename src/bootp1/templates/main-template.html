<!DOCTYPE html>
<html, lang="en">

	<style>
		#sections {
			top: 0;
			left: 0;
			list-style-type: none;
			margin: 0;
			padding: 0;
			width: 200px;
			background-color: #f1f1f1;
			height: 100%;
			position: fixed;
			overflow: auto;
		}

		.section {
			text-align: left;
			padding-left: 8px;
		}

		#tabs {
			display: flex;
			justify-content: center;
			align-items: center;
			list-style-type: none;
			margin: 0;
			padding: 0;
			background-color: #333333;
		}

		.tab {
			display: block;
			color: white;
			padding-left: 14px;
			padding-right: 16px;
			text-decoration: none;
		}
	</style>

	<head>
		{% block head %}
		<title>{% block title %}{% endblock %}</title>
		{% endblock %}
	</head>

	<body>
		<menu id="sections">
			<div id="section">
				<li group="section">Home</li>
				<li group="section">Invoices</li>
				<li group="section">Estimates</li>
				<li group="section">Vehicles</li>
				<li group="section">Insurance</li>
			</div>
		</menu>


		<menu id="tabs">
			{% block tabs %}
			{% endblock %}
		</menu>
	</body>

	</html>
