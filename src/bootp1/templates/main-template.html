<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html, lang="en">

        <style>
                #sidebar {
                        top: 0;
                        left: 0;
                        list-style-type: none;
                        margin: 0;
                        padding: 0;
                        width: 200px;
                        background-color: #f1f1f1;
                        height: 100%;
                        position: fixed;
                        overflow: auto;
                }

                #inner_sidebar {
                        margin-top: 25px;
                        margin-left: 14px;
                        margin-right: 48px;
                        border-left: 1px solid green;
                        border-right: 1px solid green;
                        border-top: 1px solid green;
                }

                .section {
                        display: block;
                        text-align: left;
                        color: black;
                        border-bottom: 1px solid green;
                        text-decoration: none;
                }

                .section:hover {
                        background-color: green;
                        color: white;
                }

                #tab_bar {
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        list-style-type: none;
                        margin: 0;
                        padding: 0;
                        background-color: #f1f1f1;
                }

                .tab {
                        display: block;
                        padding-left: 14px;
                        padding-right: 16px;
                        text-decoration: none;
                }
        </style>

        {% block style %}{% endblock %}

        <head>
                {% block head %}
                <title>{% block title %}{% endblock %}</title>
                {% endblock %}
        </head>

        <body>
                <menu id="sidebar">
                        <div id="inner_sidebar">
                                <li><a class="section" href="/home">Home</a></li>
                                <li><a class="section" href="/sections/invoices">Invoices</a></li>
                                <li><a class="section">Estimates</a></li>
                                <li><a class="section">Vehicles</a></li>
                                <li><a class="section">Insurance</a></li>
                        </div>
                </menu>


                <menu id="tab_bar">
                        {% block tabs %}
                        {% endblock %}
                </menu>
                {% block page %}
                {% endblock %}
        </body>

        </html>
