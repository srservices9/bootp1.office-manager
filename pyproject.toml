[project]
name = "bootp1"
version = "0.1.0"
description = "Boots Personal Project 1, office management web-app."
readme = "README.md"
authors = [
    { name = "srservices9", email = "srservicesc@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-wtf>=1.3.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
bootp1 = "bootp1:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
